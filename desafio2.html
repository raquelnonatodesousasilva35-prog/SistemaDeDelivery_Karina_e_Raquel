    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

   

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">Portal Delivery</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item"><a class="nav-link active" href="index.html">Início</a></li>

                    <li class="nav-item"><a class="nav-link" href="desafio1.html">Faça o seu pedido</a></li>

                    <li class="nav-item"><a class="nav-link" href="desafio2.html">Taxas de entrega</a></li>

                    <li class="nav-item"><a class="nav-link" href="desafio3.html">Tempo estimado</a></li>

                    <li class="nav-item"><a class="nav-link" href="desafio4.html">Produtos mais solicitados</a></li>

                    <li class="nav-item"><a class="nav-link" href="desafio5.html">Ranking de entregas</a></li>

                </ul>

            </div>

        </div>

    </nav>




    <main class="container my-5">


    <div class="text-center mb-4">

        <h1 class="display-5 fw-bold text-danger">
            Taxa de entrega
        </h1>

        <p class="text-secondary">
            Informe a distância da entrega para calcular a taxa.
        </p>

    </div>


    <div class="card shadow-sm border-0">

        <div class="card-body p-4">

            <h2 class="h3 text-danger mb-4">
                Calcule sua taxa
            </h2>


            <!-- FORMULÁRIO -->

            <form>

                <div class="mb-3">

                    <label
                        for="distancia"
                        class="form-label fw-bold">

                        Distância da entrega (km)

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="distancia"
                        placeholder="Digite a distância"
                        min="0"
                        step="0.1">

                </div>


                <button
                    type="button"
                    class="btn btn-danger"
                    onclick="calcularTaxaEntrega()">

                    Calcular taxa

                </button>

            </form>


            <!-- RESULTADO -->

            <div class="alert alert-danger mt-4">

                <span id="resultadoTaxa">

                    A taxa aparecerá aqui.

                </span>

            </div>

        </div>

    </div>



    </main>



    <footer class="bg-dark text-white text-center py-3 mt-auto">

        <p class="mb-0">&copy; 2026 - Prática de Desenvolvimento Web</p>
